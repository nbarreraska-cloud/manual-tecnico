name: Build F9 Word master

on:
  push:
    branches:
      - intervencion-editorial-2026-11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-f9:
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: intervencion-editorial-2026-11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install document builder
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-docx
      - name: Generate complete text-only Word document
        run: python tools/generate_f9_docx.py
      - name: Audit source-to-DOCX text fidelity and order
        run: python tools/validate_f9_text.py
      - name: Upload Word document
        uses: actions/upload-artifact@v4
        with:
          name: Manual-tecnic-pintura-miniatures-F9
          path: dist/Manual_tecnic_pintura_miniatures_F9.docx
          if-no-files-found: error
          retention-days: 30
