name: Render editorial figure

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Execució individual o auditoria de tota la llista"
        required: true
        type: choice
        options:
          - batch
          - single
        default: batch
      figure_id:
        description: "Identificador per al mode individual (p. ex. G001)"
        required: false
        type: string
        default: "G001"
  push:
    branches:
      - auditoria-cobertura-visual-incidencies-2026-11
    paths:
      - "tools/graphics/**"
      - "annexos/graphics/**"
      - "annexos/llista_definitiva_produccio_grafica_F10.md"
      - ".github/workflows/render-figure.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active visual-audit branch
        uses: actions/checkout@v4
        with:
          ref: auditoria-cobertura-visual-incidencies-2026-11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SVG rasterizer
        run: python -m pip install --upgrade pip cairosvg
      - name: Prepare specifications for all selected figures
        if: ${{ github.event_name == 'push' || inputs.run_mode == 'batch' }}
        run: python tools/graphics/prepare_all_specs.py
      - name: Build and audit full manifest
        if: ${{ github.event_name == 'push' || inputs.run_mode == 'batch' }}
        run: |
          python tools/graphics/build_manifest.py
          python tools/graphics/render_batch.py --render
      - name: Render selected figure
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'single' }}
        run: |
          FIGURE_ID="${{ inputs.figure_id || 'G001' }}"
          python tools/graphics/render_figure.py --figure "$FIGURE_ID"
      - name: Upload SVG, PNG and batch reports
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'single' && format('preview-{0}', inputs.figure_id) || 'preview-batch' }}
          path: dist/graphics/*
          if-no-files-found: error
          retention-days: 30
