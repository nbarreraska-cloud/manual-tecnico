name: Render editorial figure

on:
  workflow_dispatch:
    inputs:
      figure_id:
        description: "Identificador de la figura (p. ex. G001)"
        required: true
        type: string
        default: "G001"
  push:
    branches:
      - auditoria-cobertura-visual-incidencies-2026-11
    paths:
      - "tools/graphics/**"
      - "annexos/graphics/**"
      - ".github/workflows/render-figure.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active visual-audit branch
        uses: actions/checkout@v4
        with:
          ref: auditoria-cobertura-visual-incidencies-2026-11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SVG rasterizer
        run: python -m pip install --upgrade pip cairosvg
      - name: Render selected figure
        run: |
          FIGURE_ID="${{ inputs.figure_id || 'G001' }}"
          python tools/graphics/render_figure.py --figure "$FIGURE_ID"
      - name: Upload SVG and PNG preview
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ inputs.figure_id || 'G001' }}
          path: dist/graphics/*
          if-no-files-found: error
          retention-days: 30
