name: Render SVG prototype review

on:
  push:
    branches:
      - intervencion-editorial-2026-11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-svg-prototypes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: intervencion-editorial-2026-11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SVG renderer
        run: python -m pip install --upgrade pip cairosvg pillow
      - name: Validate SVG XML and render prototypes
        run: |
          mkdir -p dist/svg-review dist/svg-review/page-size
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import cairosvg
          from PIL import Image, ImageOps, ImageDraw
          files = sorted(Path("grafics_prova").glob("*.svg"))
          expected = {
              "fig_C04_4-1_G006_v01.svg",
              "fig_C03_3-1_G003_v01.svg",
              "fig_C16_16-4_G042_v01.svg",
              "fig_C34_34-1_G110_v01.svg",
              "fig_C04_4-2_G007_v02.svg",
              "fig_C04_4-4_G009_v02.svg",
              "fig_C04_4-6_G011_v02.svg",
              "fig_C05_5-1_G012_v02.svg",
              "fig_C05_5-2_G013_v02.svg",
              "fig_C05_5-3_G014_v02.svg",
              "fig_C05_5-5_G016_v02.svg",
              "fig_C06_6-1_G018_v02.svg",
              "fig_C06_6-1_G020_v01.svg",
              "fig_C06_6-2_G021_v01.svg",
              "fig_C06_6-3_G022_v01.svg",
              "fig_C06_6-4_G023_v01.svg",
              "fig_C06_6-5_G024_v01.svg",
              "fig_C07_7-1_G025_v01.svg",
              "fig_C15_15-1_G035_v01.svg",
              "fig_C15_15-2_G036_v01.svg",
              "fig_C04_4-2_G007_v03.svg",
              "fig_C04_4-4_G009_v03.svg",
              "fig_C04_4-6_G011_v03.svg",
              "fig_C05_5-1_G012_v03.svg",
              "fig_C05_5-2_G013_v03.svg",
              "fig_C05_5-3_G014_v03.svg",
              "fig_C05_5-5_G016_v03.svg",
              "fig_C06_6-1_G018_v03.svg",
              "fig_C06_6-2_G021_v02.svg",
              "fig_C06_6-3_G022_v02.svg",
              "fig_C06_6-4_G023_v02.svg",
              "fig_C06_6-5_G024_v02.svg",
              "fig_C07_7-1_G025_v02.svg",
              "fig_C15_15-1_G035_v02.svg",
              "fig_C15_15-2_G036_v02.svg",
              "fig_C05_5-4_G015_v01.svg",
              "fig_C05_5-6_G017_v01.svg",
              "fig_C05_5-7_G018_v04.svg",
              "fig_C07_7-2_G026_v01.svg",
              "fig_C07_7-5_G029_v01.svg",
              "fig_C04_4-4_G009_v04.svg",
              "fig_C05_5-3_G014_v04.svg",
              "fig_C05_5-5_G016_v04.svg",
              "fig_C05_5-7_G018_v05.svg",
              "fig_C06_6-4_G023_v03.svg",
              "fig_C07_7-1_G025_v03.svg",
              "fig_C15_15-1_G035_v03.svg",
              "fig_C05_5-5_G016_v05.svg",
              "fig_C05_5-7_G018_v06.svg",
              "fig_C07_7-1_G025_v04.svg",
              "fig_C15_15-1_G035_v04.svg",
              "fig_C05_5-4_G015_v02.svg",
          }
          names = {p.name for p in files}
          missing = expected - names
          if missing:
              raise SystemExit(f"Missing prototype SVGs: {sorted(missing)}")
          rendered = []
          for path in files:
              ET.parse(path)
              out = Path("dist/svg-review") / (path.stem + ".png")
              cairosvg.svg2png(url=str(path), write_to=str(out), background_color="#ffffff")
              im = Image.open(out).convert("RGB")
              if im.width < 600 or im.height < 400:
                  raise SystemExit(f"Unexpected render dimensions for {path}: {im.size}")
              rendered.append((path.name, im.copy()))
              print(f"RENDER_OK {path} {im.width}x{im.height}")
              page_out = Path("dist/svg-review/page-size") / (path.stem + ".png")
              cairosvg.svg2png(url=str(path), write_to=str(page_out), output_width=2073, background_color="#ffffff")
              print(f"PAGE_SIZE_OK {path} 2073px wide (~175.5mm at 300dpi)")
          thumbs = []
          for name, im in rendered:
              im.thumbnail((560, 340))
              tile = Image.new("RGB", (580, 380), "white")
              tile.paste(im, ((580-im.width)//2, 28))
              ImageDraw.Draw(tile).text((12, 8), name, fill="black")
              thumbs.append(tile)
          columns = 3
          rows = (len(thumbs) + columns - 1) // columns
          sheet = Image.new("RGB", (columns*580, rows*380), "#dce3e8")
          for i, tile in enumerate(thumbs):
              sheet.paste(tile, ((i%columns)*580, (i//columns)*380))
          sheet.save("dist/svg-review/contact-sheet.png")
          PY
      - name: Upload rendered previews
        uses: actions/upload-artifact@v4
        with:
          name: SVG-prototypes-rendered-review
          path: dist/svg-review/
          if-no-files-found: error
          retention-days: 30
