name: Render SVG prototype review

on:
  push:
    branches:
      - intervencion-editorial-2026-11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-svg-prototypes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: intervencion-editorial-2026-11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SVG renderer
        run: python -m pip install --upgrade pip cairosvg pillow
      - name: Validate SVG XML and render prototypes
        run: |
          mkdir -p dist/svg-review
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import cairosvg
          from PIL import Image, ImageOps, ImageDraw
          files = sorted(Path("grafics_prova").glob("*.svg"))
          expected = {
              "fig_C04_4-1_G006_v01.svg",
              "fig_C03_3-1_G003_v01.svg",
              "fig_C16_16-4_G042_v01.svg",
              "fig_C34_34-1_G110_v01.svg",
          }
          names = {p.name for p in files}
          missing = expected - names
          if missing:
              raise SystemExit(f"Missing prototype SVGs: {sorted(missing)}")
          rendered = []
          for path in files:
              ET.parse(path)
              out = Path("dist/svg-review") / (path.stem + ".png")
              cairosvg.svg2png(url=str(path), write_to=str(out), background_color="#ffffff")
              im = Image.open(out).convert("RGB")
              if im.width < 600 or im.height < 400:
                  raise SystemExit(f"Unexpected render dimensions for {path}: {im.size}")
              rendered.append((path.name, im.copy()))
              print(f"RENDER_OK {path} {im.width}x{im.height}")
          thumbs = []
          for name, im in rendered:
              im.thumbnail((560, 340))
              tile = Image.new("RGB", (580, 380), "white")
              tile.paste(im, ((580-im.width)//2, 28))
              ImageDraw.Draw(tile).text((12, 8), name, fill="black")
              thumbs.append(tile)
          columns = 3
          rows = (len(thumbs) + columns - 1) // columns
          sheet = Image.new("RGB", (columns*580, rows*380), "#dce3e8")
          for i, tile in enumerate(thumbs):
              sheet.paste(tile, ((i%columns)*580, (i//columns)*380))
          sheet.save("dist/svg-review/contact-sheet.png")
          PY
      - name: Upload rendered previews
        uses: actions/upload-artifact@v4
        with:
          name: SVG-prototypes-rendered-review
          path: dist/svg-review/
          if-no-files-found: error
          retention-days: 30
