<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Comportament d'opacitat i transparència de les pintures</title>
  <desc id="desc">Comparació conceptual de quatre graus d'ocultació del fons: transparent, semitransparent, semiopaca i opaca. La mateixa capa de color s'aplica sobre una meitat clara i una de fosca.</desc>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="100" y="105" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#20252b">COMPORTAMENT D'OPACITAT I TRANSPARÈNCIA</text>
  <text x="100" y="155" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#555d66">Comparació conceptual del grau d'ocultació del fons</text>
  <text x="100" y="220" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#343a40">Mateixa àrea, mateix color i gruix representat; varia només el grau d'ocultació.</text>
  <g transform="translate(100,285)">
    <g>
      <rect x="0" y="0" width="320" height="300" rx="8" fill="#f2f2ef" stroke="#59616a" stroke-width="2"/>
      <rect x="0" y="150" width="320" height="150" fill="#25282c"/>
      <rect x="0" y="0" width="320" height="300" rx="8" fill="#e5a13a" fill-opacity="0.16"/>
      <rect x="0" y="0" width="320" height="300" rx="8" fill="none" stroke="#59616a" stroke-width="2"/>
      <text x="160" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#20252b">Transparent</text>
      <text x="160" y="388" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#626a73">El fons continua molt visible</text>
    </g>
    <g transform="translate(360,0)">
      <rect x="0" y="0" width="320" height="300" rx="8" fill="#f2f2ef" stroke="#59616a" stroke-width="2"/>
      <rect x="0" y="150" width="320" height="150" fill="#25282c"/>
      <rect x="0" y="0" width="320" height="300" rx="8" fill="#e5a13a" fill-opacity="0.38"/>
      <rect x="0" y="0" width="320" height="300" rx="8" fill="none" stroke="#59616a" stroke-width="2"/>
      <text x="160" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#20252b">Semitransparent</text>
      <text x="160" y="388" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#626a73">El fons encara es distingeix</text>
    </g>
    <g transform="translate(720,0)">
      <rect x="0" y="0" width="320" height="300" rx="8" fill="#f2f2ef" stroke="#59616a" stroke-width="2"/>
      <rect x="0" y="150" width="320" height="150" fill="#25282c"/>
      <rect x="0" y="0" width="320" height="300" rx="8" fill="#e5a13a" fill-opacity="0.70"/>
      <rect x="0" y="0" width="320" height="300" rx="8" fill="none" stroke="#59616a" stroke-width="2"/>
      <text x="160" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#20252b">Semiopaca</text>
      <text x="160" y="388" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#626a73">El fons queda parcialment ocult</text>
    </g>
    <g transform="translate(1080,0)">
      <rect x="0" y="0" width="320" height="300" rx="8" fill="#f2f2ef" stroke="#59616a" stroke-width="2"/>
      <rect x="0" y="150" width="320" height="150" fill="#25282c"/>
      <rect x="0" y="0" width="320" height="300" rx="8" fill="#e5a13a" fill-opacity="0.97"/>
      <rect x="0" y="0" width="320" height="300" rx="8" fill="none" stroke="#59616a" stroke-width="2"/>
      <text x="160" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#20252b">Opaca</text>
      <text x="160" y="388" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#626a73">El fons queda gairebé ocult</text>
    </g>
  </g>
  <line x1="100" y1="735" x2="1500" y2="735" stroke="#d6d9dc" stroke-width="2"/>
  <text x="100" y="790" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#343a40">Nota</text>
  <text x="160" y="790" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#555d66">Esquema conceptual; no representa assajos ni propietats de pintures concretes.</text>
</svg>