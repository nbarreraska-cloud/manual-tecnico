<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Geometria de la llum i formació d’ombres</title>
<desc id="desc">Esquema conceptual en dos panells: incidència i reflexió respecte de la normal, i bloqueig de la llum amb ombra pròpia i projectada.</desc>
<defs>
  <marker id="arrowLight" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#D28A24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#397A9B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <pattern id="groundHatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M0 14 L14 0" stroke="#D7DCE0" stroke-width="1"/></pattern>
  <style>
    .ink{fill:#263238}.muted{fill:#65747B}.panel{fill:#FFFFFF;stroke:#D8DEE2;stroke-width:2}.line{stroke:#263238;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#718087;stroke-width:2;fill:none;stroke-dasharray:7 7}.light{stroke:#D28A24;stroke-width:5;fill:none;stroke-linecap:round;marker-end:url(#arrowLight)}.reflect{stroke:#397A9B;stroke-width:5;fill:none;stroke-linecap:round;marker-end:url(#arrowBlue)}.heading{font:700 34px sans-serif;fill:#263238}.sub{font:400 21px sans-serif;fill:#65747B}.label{font:600 22px sans-serif;fill:#263238}.small{font:400 19px sans-serif;fill:#526168}.tiny{font:400 17px sans-serif;fill:#65747B}
  </style>
</defs>
<rect width="1600" height="900" fill="#F4F6F7"/>
<text x="80" y="78" class="heading">Geometria de la llum i formació d’ombres</text>
<text x="80" y="116" class="sub">Esquema conceptual de la incidència, la reflexió i el bloqueig de la llum</text>
<rect x="70" y="160" width="710" height="620" rx="18" class="panel"/>
<text x="110" y="215" class="heading">1. Incidència i reflexió</text>
<text x="110" y="250" class="sub">Els angles es mesuren respecte de la normal.</text>
<path d="M150 600 H700" class="line"/>
<path d="M150 610 H700" stroke="#B8C2C7" stroke-width="5"/>
<text x="155" y="650" class="small">Superfície</text>
<path d="M430 340 V600" class="thin"/>
<text x="447" y="365" class="label">Normal</text>
<path d="M245 405 L430 600" class="light"/>
<path d="M430 600 L615 405" class="reflect"/>
<text x="155" y="380" class="label" fill="#A86A13">Raig incident</text>
<text x="545" y="380" class="label" fill="#397A9B">Raig reflectit</text>
<path d="M430 520 A80 80 0 0 0 375 543" stroke="#D28A24" stroke-width="3" fill="none"/>
<path d="M430 520 A80 80 0 0 1 485 543" stroke="#397A9B" stroke-width="3" fill="none"/>
<text x="325" y="505" class="small">θi</text>
<text x="505" y="505" class="small">θr</text>
<text x="430" y="710" text-anchor="middle" class="label">θi = θr</text>
<text x="430" y="744" text-anchor="middle" class="tiny">Llei de la reflexió en una superfície ideal</text>
<rect x="820" y="160" width="710" height="620" rx="18" class="panel"/>
<text x="860" y="215" class="heading">2. Bloqueig i ombres</text>
<text x="860" y="250" class="sub">La llum es bloqueja i crea zones no il·luminades.</text>
<path d="M875 650 H1475" class="line"/>
<rect x="875" y="654" width="600" height="55" fill="url(#groundHatch)" opacity="0.9"/>
<text x="880" y="744" class="small">Pla de suport</text>
<circle cx="970" cy="360" r="34" fill="#F6D58E" stroke="#D28A24" stroke-width="3"/>
<path d="M970 310 V292 M970 428 V410 M920 360 H902 M1038 360 H1020 M935 325 L922 312 M1005 395 L1018 408 M1005 325 L1018 312" stroke="#D28A24" stroke-width="4" stroke-linecap="round"/>
<text x="915" y="455" class="label">Font de llum</text>
<path d="M1004 350 L1185 535" class="light"/>
<path d="M1002 382 L1150 650" class="light"/>
<path d="M1190 650 L1190 530 Q1190 495 1217 475 L1240 450 Q1260 428 1282 450 L1310 480 Q1330 500 1330 535 L1330 650 Z" fill="#B9C4C8" stroke="#526168" stroke-width="3"/>
<path d="M1282 450 Q1305 472 1318 497 Q1330 518 1330 545 L1330 650 H1268 V495 Z" fill="#66747B" opacity="0.9"/>
<path d="M1282 450 Q1305 472 1318 497 Q1330 518 1330 545" stroke="#526168" stroke-width="2" fill="none"/>
<path d="M1330 650 L1455 650 L1405 675 L1330 675 Z" fill="#66747B" opacity="0.82"/>
<path d="M1004 350 L1190 530" class="thin"/>
<text x="1350" y="520" class="label">Ombra pròpia</text>
<path d="M1340 526 L1304 548" stroke="#65747B" stroke-width="2" fill="none"/>
<text x="1350" y="610" class="label">Ombra projectada</text>
<path d="M1340 616 L1392 655" stroke="#65747B" stroke-width="2" fill="none"/>
<text x="1110" y="330" class="small">Raigs de llum</text>
<text x="800" y="835" text-anchor="middle" class="tiny">Esquema conceptual; no representa una mesura ni un assaig físic concret.</text>
</svg>