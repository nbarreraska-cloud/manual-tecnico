<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#263746}.title{font-size:34px;font-weight:700}.head{font-size:25px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.tiny{font-size:14px}
.panel{fill:#fbfcfd;stroke:#aab6c1;stroke-width:2}.outline{stroke:#263746;stroke-width:4;stroke-linejoin:round}
</style></defs>
<rect width="1600" height="900" fill="#fff"/>
<text x="800" y="58" text-anchor="middle" class="title">TMM, NMM I GEOMETRIA DELS REFLEXOS</text>
<text x="800" y="92" text-anchor="middle" class="label">Dues maneres de construir l’aparença metàl·lica i adaptar els reflexos a la forma</text>
<!-- panel 1 -->
<rect x="55" y="130" width="720" height="650" rx="18" class="panel"/>
<text x="415" y="178" text-anchor="middle" class="head">1. TMM I NMM</text>
<text x="415" y="210" text-anchor="middle" class="small">Origen visual de l’efecte metàl·lic</text>
<!-- TMM swatch -->
<text x="220" y="270" text-anchor="middle" class="head">TMM</text>
<text x="220" y="298" text-anchor="middle" class="small">Pintura amb pigment metàl·lic</text>
<rect x="95" y="325" width="250" height="135" rx="10" fill="#69747d" stroke="#263746" stroke-width="3"/>
<path d="M105 430 L335 350" stroke="#dce2e6" stroke-width="17" opacity=".9"/>
<path d="M105 390 L335 325" stroke="#aeb8c0" stroke-width="5"/>
<g fill="#eef2f4" opacity=".9">
<circle cx="130" cy="350" r="3"/><circle cx="170" cy="415" r="3"/><circle cx="215" cy="365" r="3"/><circle cx="260" cy="435" r="3"/><circle cx="305" cy="380" r="3"/>
<circle cx="145" cy="440" r="2"/><circle cx="195" cy="340" r="2"/><circle cx="285" cy="345" r="2"/>
</g>
<text x="220" y="490" text-anchor="middle" class="small">La pintura aporta reflexos</text>
<text x="220" y="513" text-anchor="middle" class="small">propis del pigment metàl·lic</text>
<!-- NMM swatch -->
<text x="590" y="270" text-anchor="middle" class="head">NMM</text>
<text x="590" y="298" text-anchor="middle" class="small">Pintures convencionals</text>
<rect x="465" y="325" width="250" height="135" rx="10" fill="#70777d" stroke="#263746" stroke-width="3"/>
<path d="M470 330 H710 V365 H470Z" fill="#e8e8e8"/>
<path d="M470 365 H710 V395 H470Z" fill="#454b52"/>
<path d="M470 395 H710 V425 H470Z" fill="#c5cbd0"/>
<path d="M470 425 H710 V455 H470Z" fill="#343a40"/>
<path d="M470 455 H710" stroke="#263746" stroke-width="2"/>
<text x="590" y="490" text-anchor="middle" class="small">L’efecte es pinta mitjançant</text>
<text x="590" y="513" text-anchor="middle" class="small">valors, colors i reflexos simulats</text>
<path d="M375 392 H435" stroke="#263746" stroke-width="2" stroke-dasharray="6 6"/>
<text x="415" y="565" text-anchor="middle" class="label" font-weight="700">No són el mateix procediment</text>
<text x="415" y="598" text-anchor="middle" class="small">TMM: reflexió associada al pigment metàl·lic.</text>
<text x="415" y="625" text-anchor="middle" class="small">NMM: aparença reflectant construïda pictòricament.</text>
<text x="415" y="690" text-anchor="middle" class="tiny">Esquemes conceptuals; no són mostres de pintura ni</text>
<text x="415" y="712" text-anchor="middle" class="tiny">reprodueixen propietats òptiques mesurades.</text>
<!-- panel 2 -->
<rect x="825" y="130" width="720" height="650" rx="18" class="panel"/>
<text x="1185" y="178" text-anchor="middle" class="head">2. GEOMETRIA I REFLEXOS</text>
<text x="1185" y="210" text-anchor="middle" class="small">El patró s’adapta a la forma de la peça</text>
<!-- flat plane -->
<text x="1000" y="270" text-anchor="middle" class="label" font-weight="700">Superfície plana / facetada</text>
<polygon points="875,325 1125,325 1095,485 845,485" fill="#70777d" class="outline"/>
<polygon points="875,325 1000,325 970,485 845,485" fill="#d9dde0" stroke="#263746" stroke-width="2"/>
<polygon points="1000,325 1125,325 1095,485 970,485" fill="#424950" stroke="#263746" stroke-width="2"/>
<path d="M882 340 L990 340 L965 465 L860 465Z" fill="#f2f2f2" opacity=".8"/>
<path d="M1005 345 L1110 345 L1085 465 L980 465Z" fill="#737b82" opacity=".65"/>
<text x="985" y="520" text-anchor="middle" class="small">Blocs i canvis definits</text>
<text x="985" y="543" text-anchor="middle" class="small">entre plans orientats diferentment</text>
<!-- cylinder -->
<text x="1360" y="270" text-anchor="middle" class="label" font-weight="700">Superfície corba / cilíndrica</text>
<rect x="1240" y="325" width="240" height="160" rx="75" fill="#626a71" class="outline"/>
<path d="M1300 327 C1275 365 1275 445 1300 483 L1350 483 C1325 445 1325 365 1350 327Z" fill="#e6e8ea" stroke="#263746" stroke-width="2"/>
<path d="M1395 327 C1420 365 1420 445 1395 483 L1445 483 C1470 445 1470 365 1445 327Z" fill="#333a40" stroke="#263746" stroke-width="2"/>
<path d="M1350 327 C1335 365 1335 445 1350 483 L1395 483 C1410 445 1410 365 1395 327Z" fill="#9da5ab" stroke="#263746" stroke-width="2"/>
<text x="1360" y="520" text-anchor="middle" class="small">Bandes i transicions</text>
<text x="1360" y="543" text-anchor="middle" class="small">que segueixen la curvatura</text>
<!-- bottom callout -->
<path d="M875 600 H1495" stroke="#aab6c1" stroke-width="2"/>
<text x="1185" y="642" text-anchor="middle" class="label" font-weight="700">Abans de pintar, identifica:</text>
<text x="1185" y="675" text-anchor="middle" class="small">geometria · orientació dels plans · patró de reflexos · jerarquia tonal</text>
<text x="1185" y="716" text-anchor="middle" class="tiny">Exemples esquemàtics: no hi ha un patró universal per a cada geometria.</text>
<text x="800" y="845" text-anchor="middle" class="label" font-weight="700">La forma condiciona la distribució dels reflexos; la simplificació ha de conservar-ne la lectura.</text>
</svg>