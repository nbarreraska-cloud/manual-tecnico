<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs>
 <pattern id="checker" width="28" height="28" patternUnits="userSpaceOnUse"><rect width="28" height="28" fill="#fff"/><rect width="14" height="14" fill="#d8e0e5"/><rect x="14" y="14" width="14" height="14" fill="#d8e0e5"/></pattern>
 <style>
 .title{font:700 34px Arial,sans-serif;fill:#183247}.sub{font:700 23px Arial,sans-serif;fill:#28465b}.body{font:19px Arial,sans-serif;fill:#263b49}.small{font:16px Arial,sans-serif;fill:#526777}.panel{fill:#fff;stroke:#aebfc9;stroke-width:2}
 </style>
</defs>
<rect width="1400" height="900" fill="#f3f6f8"/>
<text x="700" y="54" text-anchor="middle" class="title">Opacitat, transparència i visibilitat del fons</text>
<text x="700" y="88" text-anchor="middle" class="small">Esquema conceptual: la mateixa capa representada sobre un patró de referència</text>
<g>
 <rect x="40" y="130" width="320" height="500" rx="14" class="panel"/>
 <rect x="380" y="130" width="320" height="500" rx="14" class="panel"/>
 <rect x="720" y="130" width="320" height="500" rx="14" class="panel"/>
 <rect x="1060" y="130" width="300" height="500" rx="14" class="panel"/>
</g>
<g class="sub" text-anchor="middle">
 <text x="200" y="175">Ocultació molt alta</text><text x="540" y="175">Ocultació alta</text>
 <text x="880" y="175">Ocultació parcial</text><text x="1210" y="175">Fons molt visible</text>
</g>
<g>
 <rect x="75" y="205" width="250" height="290" fill="url(#checker)" stroke="#8397a4"/>
 <rect x="415" y="205" width="250" height="290" fill="url(#checker)" stroke="#8397a4"/>
 <rect x="755" y="205" width="250" height="290" fill="url(#checker)" stroke="#8397a4"/>
 <rect x="1090" y="205" width="240" height="290" fill="url(#checker)" stroke="#8397a4"/>
 <g fill="#3479a8">
  <rect x="75" y="205" width="250" height="290" opacity="0.96"/>
  <rect x="415" y="205" width="250" height="290" opacity="0.78"/>
  <rect x="755" y="205" width="250" height="290" opacity="0.48"/>
  <rect x="1090" y="205" width="240" height="290" opacity="0.20"/>
 </g>
 <g stroke="#263b49" stroke-width="2" fill="none">
  <rect x="75" y="205" width="250" height="290"/><rect x="415" y="205" width="250" height="290"/>
  <rect x="755" y="205" width="250" height="290"/><rect x="1090" y="205" width="240" height="290"/>
 </g>
</g>
<g class="body" text-anchor="middle">
 <text x="200" y="535">El patró queda gairebé ocult</text>
 <text x="540" y="535">El patró es percep atenuat</text>
 <text x="880" y="535">El patró continua recognoscible</text>
 <text x="1210" y="535">El patró domina la lectura</text>
</g>
<g class="small" text-anchor="middle">
 <text x="700" y="655">Els quatre exemples són valors gràfics il·lustratius, no llindars ni categories comercials.</text>
 <text x="700" y="680" class="body">Opacitat: capacitat d'atenuar o ocultar el fons.</text>
 <text x="700" y="714" class="body">Transparència: grau en què el fons continua sent visible a través de la capa.</text>
 <text x="700" y="748" class="body">Cobertura: uniformitat amb què la capa cobreix el suport; no és sinònim d'opacitat.</text>
 <text x="700" y="825">La lectura depèn del pigment, la capa, el suport i les condicions d'aplicació.</text>
</g>
</svg>