<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><defs><style>.t{font:700 28px Arial,sans-serif;fill:#183247}.h{font:700 19px Arial,sans-serif;fill:#28465b}.b{font:16px Arial,sans-serif;fill:#263b49}.s{font:13px Arial,sans-serif;fill:#526777}.p{fill:#fff;stroke:#b7c7d1;stroke-width:2}.ln{stroke:#526777;stroke-width:3;fill:none}</style></defs><rect width="1400" height="900" fill="#f3f6f8"/><text x="700" y="55" text-anchor="middle" class="t">Relació conceptual entre matís, valor i croma</text><rect x="40" y="110" width="1320" height="680" rx="16" class="p"/><path d="M220 610 C260 360 430 230 650 230 C870 230 1040 360 1080 610" stroke="#526777" stroke-width="3" fill="none"/><path d="M220 610 Q650 760 1080 610" stroke="#526777" stroke-width="3" fill="none"/><path d="M650 230 V680" stroke="#526777" stroke-width="3" stroke-dasharray="8 8"/><path d="M220 610 L650 230 L1080 610" stroke="#526777" stroke-width="2" fill="none"/><ellipse cx="650" cy="610" rx="430" ry="150" fill="#d9e5eb" opacity=".45" stroke="#526777" stroke-width="2"/><g class="h"><text x="650" y="190" text-anchor="middle">Valor més clar</text><text x="650" y="730" text-anchor="middle">Valor més fosc</text><text x="190" y="630">Croma</text><text x="1100" y="630">Croma</text><text x="650" y="690" text-anchor="middle">Matís: família cromàtica al voltant de l'eix</text></g><text x="700" y="765" text-anchor="middle" class="s">Esquema explicatiu no quantitatiu: no és un model colorimètric ni un sòlid Munsell exacte.</text></svg>