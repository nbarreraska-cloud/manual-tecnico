<g class="s"><text x="130" y="760">Monocromàtica: variacions d'un mateix matís.</text><text x="700" y="760" text-anchor="middle">Anàloga: matisos veïns al cercle.</text><text x="1270" y="760" text-anchor="end">Complementària: matisos oposats.</text><text x="700" y="790" text-anchor="middle">Complementària dividida: un matís i els dos veïns del seu complementari.</text></g>
