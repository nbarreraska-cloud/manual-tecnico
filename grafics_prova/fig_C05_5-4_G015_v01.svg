<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><defs><style>.t{font:700 30px Arial,sans-serif;fill:#183247}.h{font:700 22px Arial,sans-serif;fill:#28465b}.b{font:18px Arial,sans-serif;fill:#263b49}.s{font:16px Arial,sans-serif;fill:#526777}.p{fill:#fff;stroke:#b7c7d1;stroke-width:2}.line{stroke:#28465b;stroke-width:4;fill:none}.ray{stroke:#d3a52d;stroke-width:5;fill:none}.shade{fill:#718594;opacity:.65}</style></defs><rect width="1400" height="900" fill="#f3f6f8"/><text x="700" y="55" text-anchor="middle" class="t">Bloqueig de la llum i formació de l'ombra</text><rect x="35" y="110" width="1330" height="680" rx="16" class="p"/><circle cx="220" cy="250" r="42" fill="#f2c94c"/><text x="220" y="320" text-anchor="middle" class="b">Font lluminosa</text><path d="M270 250 L550 650" class="ray"/><path d="M270 250 L700 450 L1180 650" class="ray"/><path d="M130 650 H1270" stroke="#28465b" stroke-width="7"/><rect x="700" y="450" width="150" height="200" fill="#9fb8c7" stroke="#28465b" stroke-width="4"/><path d="M850 650 L1180 650 L1180 650 Z" class="shade"/><path d="M850 650 L1180 650" stroke="#526777" stroke-width="20" opacity=".8"/><text x="775" y="420" text-anchor="middle" class="b">Objecte bloquejador</text><text x="1030" y="710" text-anchor="middle" class="b">Regió d'ombra</text><text x="1050" y="600" class="s">Raig bloquejat</text><text x="470" y="600" class="s">Raig no bloquejat</text><text x="700" y="755" text-anchor="middle" class="s">L'ombra apareix quan l'objecte intercepta la trajectòria entre la font i la superfície receptora.</text></svg>