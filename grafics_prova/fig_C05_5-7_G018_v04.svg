<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><defs><style>.t{font:700 30px Arial,sans-serif;fill:#183247}.h{font:700 22px Arial,sans-serif;fill:#28465b}.b{font:18px Arial,sans-serif;fill:#263b49}.s{font:16px Arial,sans-serif;fill:#526777}.p{fill:#fff;stroke:#b7c7d1;stroke-width:2}.line{stroke:#28465b;stroke-width:4;fill:none}.ray{stroke:#d3a52d;stroke-width:5;fill:none}.shade{fill:#718594;opacity:.65}</style></defs><rect width="1400" height="900" fill="#f3f6f8"/><text x="700" y="55" text-anchor="middle" class="t">Senyals visuals que suggereixen profunditat i volum</text><rect x="35" y="110" width="650" height="680" rx="16" class="p"/><rect x="715" y="110" width="650" height="680" rx="16" class="p"/><text x="360" y="175" text-anchor="middle" class="h">Objecte tridimensional</text><text x="1040" y="175" text-anchor="middle" class="h">Representació bidimensional</text><path d="M180 520 L300 300 L500 360 L500 590 L300 650 Z" fill="#a9c0ce" stroke="#28465b" stroke-width="4"/><path d="M300 300 L300 650 M300 300 L500 360" stroke="#fff" stroke-width="5"/><path d="M300 650 L500 590 L500 360" fill="#526777" opacity=".8"/><path d="M120 250 L300 360" class="ray"/><text x="140" y="220" class="s">Font</text><g class="b"><text x="160" y="700">Orientació i contorn</text><text x="390" y="700">Llum, ombra i reflex</text></g><rect x="850" y="300" width="380" height="290" fill="#e7edf0" stroke="#28465b" stroke-width="3"/><path d="M850 300 L1030 380 L1230 300" stroke="#fff" stroke-width="18" fill="none"/><path d="M850 590 L1030 510 L1230 590" stroke="#526777" stroke-width="24" fill="none"/><path d="M850 300 V590 M1230 300 V590" stroke="#28465b" stroke-width="4"/><g class="b"><text x="1040" y="650" text-anchor="middle">Contorn, contrast i superposició</text><text x="1040" y="685" text-anchor="middle">seleccionats per suggerir volum</text></g><text x="700" y="750" text-anchor="middle" class="s">La representació combina diverses senyals visuals; cap transició aïllada explica per si sola el volum.</text></svg>