<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><defs><style>.t{font:700 30px Arial,sans-serif;fill:#183247}.h{font:700 22px Arial,sans-serif;fill:#28465b}.b{font:18px Arial,sans-serif;fill:#263b49}.s{font:16px Arial,sans-serif;fill:#526777}.p{fill:#fff;stroke:#b7c7d1;stroke-width:2}.line{stroke:#28465b;stroke-width:4;fill:none}.ray{stroke:#d3a52d;stroke-width:5;fill:none}.normal{stroke:#d34b43;stroke-width:4;stroke-dasharray:11 8;fill:none}</style></defs><rect width="1400" height="900" fill="#f3f6f8"/><text x="700" y="55" text-anchor="middle" class="t">Senyals visuals que suggereixen profunditat i volum</text><rect x="35" y="110" width="650" height="680" rx="16" class="p"/><rect x="715" y="110" width="650" height="680" rx="16" class="p"/><text x="360" y="175" text-anchor="middle" class="h">Objecte tridimensional</text><text x="1040" y="175" text-anchor="middle" class="h">Representació bidimensional</text><path d="M190 250 L330 330" class="ray"/><text x="150" y="225" class="s">Font</text><path d="M230 360 L420 270 L590 360 L400 450 Z" fill="#d7e3e9" stroke="#28465b" stroke-width="4"/><path d="M230 360 L400 450 V650 L230 560 Z" fill="#a9c0ce" stroke="#28465b" stroke-width="4"/><path d="M400 450 L590 360 V560 L400 650 Z" fill="#526777" stroke="#28465b" stroke-width="4"/><path d="M330 330 L420 270" stroke="#fff" stroke-width="7"/><path d="M400 450 V650" stroke="#28465b" stroke-width="4"/><text x="360" y="700" text-anchor="middle" class="s">Plans, arestes i superposició</text><path d="M910 360 L1100 270 L1270 360 L1080 450 Z" fill="#d7e3e9" stroke="#28465b" stroke-width="4"/><path d="M910 360 L1080 450 V650 L910 560 Z" fill="#a9c0ce" stroke="#28465b" stroke-width="4"/><path d="M1080 450 L1270 360 V560 L1080 650 Z" fill="#526777" stroke="#28465b" stroke-width="4"/><path d="M1000 315 L1100 270" stroke="#fff" stroke-width="7"/><path d="M1080 450 V650" stroke="#28465b" stroke-width="4"/><text x="1040" y="700" text-anchor="middle" class="s">Contorn, contrast i reflex seleccionats</text><text x="700" y="755" text-anchor="middle" class="s">La representació bidimensional conserva les relacions principals de forma, llum, ombra i contorn.</text></svg>