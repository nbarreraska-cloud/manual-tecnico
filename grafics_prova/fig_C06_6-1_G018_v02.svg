<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><defs><style>.t{font:700 30px Arial;fill:#183247}.b{font:18px Arial;fill:#263b49}.s{font:14px Arial;fill:#526777}</style><linearGradient id="sphere" x1="0" x2="1" y1="0" y2="0"><stop stop-color="#f4e4b5"/><stop offset=".42" stop-color="#a8c2d1"/><stop offset="1" stop-color="#344d61"/></linearGradient></defs><rect width="1400" height="900" fill="#f3f6f8"/><text x="700" y="55" text-anchor="middle" class="t">Distribució conceptual de la llum sobre una superfície corba</text><rect x="40" y="110" width="1320" height="680" rx="16" fill="#fff" stroke="#b7c7d1" stroke-width="2"/><circle cx="240" cy="310" r="48" fill="#f2c94c"/><path d="M290 310 L510 420" stroke="#d3a52d" stroke-width="6"/><circle cx="700" cy="440" r="220" fill="url(#sphere)" stroke="#28465b" stroke-width="4"/><path d="M700 220 V660 M480 440 H920" stroke="#fff" stroke-width="2" opacity=".5"/><g class="b"><text x="240" y="390" text-anchor="middle">Font</text><text x="700" y="720" text-anchor="middle">Superfície corba</text><text x="1010" y="330">Transició gradual</text></g><text x="700" y="760" text-anchor="middle" class="s">Gradient esquemàtic per explicar una variació visual; no és una simulació fotomètrica ni un càlcul de normals.</text></svg>