<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><defs><style>.t{font:700 30px Arial,sans-serif;fill:#183247}.h{font:700 22px Arial,sans-serif;fill:#28465b}.b{font:18px Arial,sans-serif;fill:#263b49}.s{font:16px Arial,sans-serif;fill:#526777}.p{fill:#fff;stroke:#b7c7d1;stroke-width:2}.line{stroke:#28465b;stroke-width:4;fill:none}.ray{stroke:#d3a52d;stroke-width:5;fill:none}.normal{stroke:#d34b43;stroke-width:4;stroke-dasharray:11 8;fill:none}</style></defs><rect width="1400" height="900" fill="#f3f6f8"/><text x="700" y="55" text-anchor="middle" class="t">Il·luminació de superfícies planes i corbes</text><rect x="35" y="110" width="650" height="680" rx="16" class="p"/><rect x="715" y="110" width="650" height="680" rx="16" class="p"/><text x="360" y="175" text-anchor="middle" class="h">Pla: orientació constant</text><circle cx="145" cy="260" r="32" fill="#f2c94c"/><text x="145" y="315" text-anchor="middle" class="s">Font</text><path d="M185 260 L420 520" class="ray"/><path d="M150 520 H570" stroke="#6d9db9" stroke-width="28"/><path d="M360 505 V280" class="normal"/><text x="360" y="245" text-anchor="middle" class="s">Normal constant</text><text x="360" y="590" text-anchor="middle" class="b">La inclinació no varia</text><text x="1040" y="175" text-anchor="middle" class="h">Superfície corba: normals variables</text><circle cx="830" cy="260" r="32" fill="#f2c94c"/><text x="830" y="315" text-anchor="middle" class="s">Mateixa font</text><path d="M870 260 L1040 310" class="ray"/><path d="M790 560 A250 250 0 0 1 1290 560" fill="none" stroke="#6d9db9" stroke-width="28"/><path d="M1040 560 V300 M863 383 L720 240 M1217 383 L1360 240" class="normal"/><circle cx="1040" cy="560" r="6" fill="#d34b43"/><circle cx="863" cy="383" r="6" fill="#d34b43"/><circle cx="1217" cy="383" r="6" fill="#d34b43"/><text x="1040" y="635" text-anchor="middle" class="b">L'orientació local canvia</text><text x="700" y="735" text-anchor="middle" class="s">Comparació conceptual sota una mateixa direcció general de llum; no és un càlcul fotomètric.</text></svg>