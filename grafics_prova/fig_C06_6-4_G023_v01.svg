<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><defs><style>.t{font:700 30px Arial,sans-serif;fill:#183247}.h{font:700 21px Arial,sans-serif;fill:#28465b}.b{font:17px Arial,sans-serif;fill:#263b49}.s{font:14px Arial,sans-serif;fill:#526777}.p{fill:#fff;stroke:#b7c7d1;stroke-width:2}.ln{stroke:#526777;stroke-width:2;fill:none}</style></defs><rect width="1400" height="900" fill="#f3f6f8"/><text x="700" y="52" text-anchor="middle" class="t">Distribució dels reflexos sobre una superfície</text><rect x="35" y="100" width="1330" height="700" rx="18" class="p"/><g><rect x="100" y="240" width="270" height="250" rx="16" fill="#8999a5"/><rect x="565" y="240" width="270" height="250" rx="16" fill="#8999a5"/><rect x="1030" y="240" width="270" height="250" rx="16" fill="#8999a5"/><path d="M140 300 H330" stroke="#fff" stroke-width="32"/><path d="M605 300 Q700 250 795 300" stroke="#fff" stroke-width="38" fill="none"/><path d="M1070 285 L1110 285 M1150 340 L1190 340 M1230 285 L1270 285 M1080 410 L1120 410" stroke="#fff" stroke-width="18"/></g><g class="h"><text x="235" y="190" text-anchor="middle">Definit</text><text x="700" y="190" text-anchor="middle">Estès</text><text x="1165" y="190" text-anchor="middle">Fragmentat</text></g><g class="b"><text x="235" y="550" text-anchor="middle">Reflex concentrat</text><text x="700" y="550" text-anchor="middle">Reflex ampli</text><text x="1165" y="550" text-anchor="middle">Reflex discontinu</text></g><text x="700" y="730" text-anchor="middle" class="s">Les formes representen patrons esquemàtics de reflex; no assignen automàticament un acabat a un material.</text></svg>