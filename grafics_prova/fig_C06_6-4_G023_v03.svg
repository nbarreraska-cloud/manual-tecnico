<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><defs><style>.t{font:700 30px Arial,sans-serif;fill:#183247}.h{font:700 22px Arial,sans-serif;fill:#28465b}.b{font:18px Arial,sans-serif;fill:#263b49}.s{font:16px Arial,sans-serif;fill:#526777}.p{fill:#fff;stroke:#b7c7d1;stroke-width:2}.line{stroke:#28465b;stroke-width:4;fill:none}.ray{stroke:#d3a52d;stroke-width:5;fill:none}.normal{stroke:#d34b43;stroke-width:4;stroke-dasharray:11 8;fill:none}</style></defs><rect width="1400" height="900" fill="#f3f6f8"/><text x="700" y="55" text-anchor="middle" class="t">Un indici compartit no identifica per si sol un material</text><rect x="35" y="110" width="1330" height="680" rx="16" class="p"/><text x="700" y="175" text-anchor="middle" class="h">Indici visual compartit: reflex clar horitzontal</text><rect x="160" y="260" width="270" height="260" rx="12" fill="#9aa9b2" stroke="#526777" stroke-width="3"/><rect x="530" y="260" width="270" height="260" rx="12" fill="#9aa9b2" stroke="#526777" stroke-width="3"/><rect x="900" y="260" width="270" height="260" rx="12" fill="#9aa9b2" stroke="#526777" stroke-width="3"/><path d="M190 330 H400 M560 330 H770 M930 330 H1140" stroke="#fff" stroke-width="24"/><g stroke="#526777" stroke-width="5" fill="none"><path d="M180 400 H410 M180 455 H410 M550 380 L575 405 L600 380 L625 405 L650 380 L675 405 L700 380 L725 405 L750 380"/><path d="M920 400 H1150 M920 455 H1150"/></g><g class="h"><text x="295" y="225" text-anchor="middle">Superfície A</text><text x="665" y="225" text-anchor="middle">Superfície B</text><text x="1035" y="225" text-anchor="middle">Superfície C</text></g><g class="b"><text x="295" y="570" text-anchor="middle">Estructura regular</text><text x="665" y="570" text-anchor="middle">Textura granulada</text><text x="1035" y="570" text-anchor="middle">Patró estratificat</text></g><text x="665" y="655" text-anchor="middle" class="b">Geometria, estructura, textura i resposta òptica aporten informació diferent</text><text x="700" y="735" text-anchor="middle" class="s">Una mateixa senyal pot aparèixer en materials diferents i no constitueix una prova d'identitat.</text></svg>