<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><defs><style>.t{font:700 30px Arial,sans-serif;fill:#183247}.h{font:700 21px Arial,sans-serif;fill:#28465b}.b{font:17px Arial,sans-serif;fill:#263b49}.s{font:14px Arial,sans-serif;fill:#526777}.p{fill:#fff;stroke:#b7c7d1;stroke-width:2}</style></defs><rect width="1400" height="900" fill="#f3f6f8"/><text x="700" y="55" text-anchor="middle" class="t">Percepció del fons a través dels materials</text><rect x="40" y="110" width="1320" height="690" rx="16" class="p"/><g><rect x="110" y="250" width="350" height="300" fill="#fff"/><rect x="525" y="250" width="350" height="300" fill="#fff"/><rect x="940" y="250" width="350" height="300" fill="#fff"/><g stroke="#334b5b" stroke-width="9"><path d="M150 300 H420 M150 390 H420 M150 480 H420 M565 300 H835 M565 390 H835 M565 480 H835 M980 300 H1250 M980 390 H1250 M980 480 H1250"/></g><rect x="110" y="250" width="350" height="300" fill="#667782"/><rect x="525" y="250" width="350" height="300" fill="#a9cbdc" opacity=".16"/><rect x="940" y="250" width="350" height="300" fill="#a9cbdc" opacity=".8"/></g><g class="h"><text x="285" y="205" text-anchor="middle">Opac</text><text x="700" y="205" text-anchor="middle">Transparent</text><text x="1115" y="205" text-anchor="middle">Translúcid</text></g><g class="b"><text x="285" y="610" text-anchor="middle">Fons no visible</text><text x="700" y="610" text-anchor="middle">Detall conservat</text><text x="1115" y="610" text-anchor="middle">Detall difuminat</text></g><text x="700" y="740" text-anchor="middle" class="s">Esquema comparatiu; la transmissió i la difusió depenen del material i de les condicions d'observació.</text></svg>