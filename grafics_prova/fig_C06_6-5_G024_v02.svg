<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><defs><style>.t{font:700 30px Arial,sans-serif;fill:#183247}.h{font:700 22px Arial,sans-serif;fill:#28465b}.b{font:18px Arial,sans-serif;fill:#263b49}.s{font:16px Arial,sans-serif;fill:#526777}.p{fill:#fff;stroke:#b7c7d1;stroke-width:2}.line{stroke:#28465b;stroke-width:4;fill:none}.ray{stroke:#d3a52d;stroke-width:5;fill:none}.normal{stroke:#d34b43;stroke-width:4;stroke-dasharray:11 8;fill:none}</style></defs><rect width="1400" height="900" fill="#f3f6f8"/><text x="700" y="55" text-anchor="middle" class="t">Simplificació i jerarquia visual a escala miniatura</text><rect x="35" y="140" width="420" height="590" rx="16" class="p"/><rect x="490" y="140" width="420" height="590" rx="16" class="p"/><rect x="945" y="140" width="420" height="590" rx="16" class="p"/><g class="h"><text x="245" y="205" text-anchor="middle">Referència material</text><text x="700" y="205" text-anchor="middle">Selecció d'indicis</text><text x="1155" y="205" text-anchor="middle">Representació simplificada</text></g><rect x="135" y="285" width="220" height="250" fill="#a88969" stroke="#526777" stroke-width="3"/><path d="M145 330 Q210 300 345 350 M145 385 Q250 360 345 410 M145 460 Q220 430 345 485" stroke="#4e3b2e" stroke-width="8" fill="none"/><path d="M150 300 L330 300 M150 515 L330 515" stroke="#d9c3a4" stroke-width="5"/><path d="M355 410 H490 M470 395 L490 410 L470 425" class="line"/><rect x="590" y="285" width="220" height="250" fill="#a88969" stroke="#526777" stroke-width="3"/><path d="M600 350 Q700 320 800 360 M600 465 Q700 435 800 475" stroke="#4e3b2e" stroke-width="12" fill="none"/><path d="M600 300 L800 300" stroke="#fff" stroke-width="14"/><path d="M810 410 H945 M925 395 L945 410 L925 425" class="line"/><rect x="1055" y="285" width="200" height="250" fill="#a88969" stroke="#526777" stroke-width="3"/><path d="M1070 355 Q1155 330 1240 360 M1070 470 Q1155 445 1240 475" stroke="#4e3b2e" stroke-width="14" fill="none"/><g class="b"><text x="245" y="590" text-anchor="middle">Moltes senyals i detalls</text><text x="700" y="590" text-anchor="middle">Conservar les més informatives</text><text x="1155" y="590" text-anchor="middle">Reduir i ordenar els detalls</text></g><text x="700" y="665" text-anchor="middle" class="s">La simplificació conserva l'estructura principal i elimina informació secundària sense perdre coherència.</text></svg>