<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><defs><style>.t{font:700 30px Arial,sans-serif;fill:#183247}.h{font:700 22px Arial,sans-serif;fill:#28465b}.b{font:18px Arial,sans-serif;fill:#263b49}.s{font:16px Arial,sans-serif;fill:#526777}.p{fill:#fff;stroke:#b7c7d1;stroke-width:2}.line{stroke:#28465b;stroke-width:4;fill:none}.ray{stroke:#d3a52d;stroke-width:5;fill:none}.normal{stroke:#d34b43;stroke-width:4;stroke-dasharray:11 8;fill:none}</style></defs><rect width="1400" height="900" fill="#f3f6f8"/><text x="700" y="55" text-anchor="middle" class="t">Components i formes de punta del pinzell</text><rect x="35" y="110" width="1330" height="680" rx="16" class="p"/><text x="370" y="180" text-anchor="middle" class="h">Parts del pinzell</text><path d="M310 330 Q370 245 430 330 L420 430 L320 430 Z" fill="#c9a477" stroke="#526777" stroke-width="3"/><path d="M320 430 L420 430 L405 510 L335 510 Z" fill="#aab7c0" stroke="#526777" stroke-width="3"/><path d="M335 510 L405 510 L455 720 Q370 760 285 720 Z" fill="#c99b6d" stroke="#526777" stroke-width="3"/><path d="M310 330 L370 235 L430 330" fill="#6b5141" stroke="#526777" stroke-width="3"/><path d="M290 290 L190 245 H90" class="line"/><text x="90" y="220" class="b">Pèl o filament</text><path d="M420 465 L535 445 H625" class="line"/><text x="635" y="450" class="b">Virolla</text><path d="M410 610 L535 650 H625" class="line"/><text x="635" y="660" class="b">Mànec</text><path d="M700 210 V700" stroke="#b7c7d1" stroke-width="2"/><text x="1040" y="180" text-anchor="middle" class="h">Formes de punta</text><g transform="translate(780 270)"><path d="M0 0 Q35 -50 70 0 L65 110 H5 Z" fill="#6b5141"/><text x="35" y="150" text-anchor="middle" class="s">Rodona</text><path d="M130 110 Q165 30 200 110 L165 0 Z" fill="#6b5141"/><text x="165" y="150" text-anchor="middle" class="s">Fina</text><path d="M260 0 H330 V110 H260 Z" fill="#6b5141"/><text x="295" y="150" text-anchor="middle" class="s">Plana</text><path d="M390 25 L460 0 L440 110 H370 Z" fill="#6b5141"/><text x="415" y="150" text-anchor="middle" class="s">Angular</text></g><text x="1040" y="540" text-anchor="middle" class="b">La forma facilita determinades aplicacions, però no determina per si sola la precisió.</text><text x="700" y="760" text-anchor="middle" class="s">Esquema funcional no a escala; la construcció varia segons el tipus de pinzell.</text></svg>