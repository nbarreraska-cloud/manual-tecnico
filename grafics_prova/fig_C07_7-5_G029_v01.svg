<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><defs><style>.t{font:700 30px Arial,sans-serif;fill:#183247}.h{font:700 22px Arial,sans-serif;fill:#28465b}.b{font:18px Arial,sans-serif;fill:#263b49}.s{font:16px Arial,sans-serif;fill:#526777}.p{fill:#fff;stroke:#b7c7d1;stroke-width:2}.line{stroke:#28465b;stroke-width:4;fill:none}.ray{stroke:#d3a52d;stroke-width:5;fill:none}.shade{fill:#718594;opacity:.65}</style></defs><rect width="1400" height="900" fill="#f3f6f8"/><text x="700" y="55" text-anchor="middle" class="t">Preparació operativa de les pintures</text><rect x="35" y="110" width="1330" height="680" rx="16" class="p"/><circle cx="145" cy="390" r="78" fill="#e7edf0" stroke="#526777" stroke-width="3"/><text x="145" y="398" text-anchor="middle" class="h">1</text><circle cx="390" cy="390" r="78" fill="#e7edf0" stroke="#526777" stroke-width="3"/><text x="390" y="398" text-anchor="middle" class="h">2</text><circle cx="635" cy="390" r="78" fill="#e7edf0" stroke="#526777" stroke-width="3"/><text x="635" y="398" text-anchor="middle" class="h">3</text><circle cx="880" cy="390" r="78" fill="#e7edf0" stroke="#526777" stroke-width="3"/><text x="880" y="398" text-anchor="middle" class="h">4</text><circle cx="1125" cy="390" r="78" fill="#e7edf0" stroke="#526777" stroke-width="3"/><text x="1125" y="398" text-anchor="middle" class="h">5</text><path d="M225 390 H310 M295 375 L310 390 L295 405 M470 390 H555 M540 375 L555 390 L540 405 M715 390 H800 M785 375 L800 390 L785 405 M960 390 H1045 M1030 375 L1045 390 L1030 405" class="line"/><g class="b"><text x="145" y="520" text-anchor="middle">Comprovar</text><text x="145" y="550" text-anchor="middle">producte</text><text x="390" y="520" text-anchor="middle">Homogeneïtzar</text><text x="635" y="520" text-anchor="middle">Dosificar</text><text x="880" y="520" text-anchor="middle">Fer una prova</text><text x="1125" y="520" text-anchor="middle">Ajustar consistència</text></g><g class="s"><text x="14