<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><defs><style>.t{font:700 30px Arial,sans-serif;fill:#183247}.h{font:700 21px Arial,sans-serif;fill:#28465b}.b{font:17px Arial,sans-serif;fill:#263b49}.s{font:14px Arial,sans-serif;fill:#526777}.p{fill:#fff;stroke:#b7c7d1;stroke-width:2}</style></defs><rect width="1400" height="900" fill="#f3f6f8"/><text x="700" y="55" text-anchor="middle" class="t">Anàlisi de geometria, volums i superfícies</text><rect x="40" y="110" width="1320" height="690" rx="16" class="p"/><g transform="translate(150 220)"><path d="M0 220 L170 40 L340 220 L170 400 Z" fill="#a8c1d1" stroke="#28465b" stroke-width="4"/><path d="M170 40 V400 M0 220 H340" stroke="#fff" stroke-width="3"/><text x="170" y="465" text-anchor="middle" class="b">Geometria</text></g><g transform="translate(530 220)"><circle cx="170" cy="220" r="175" fill="#b8c8d2" stroke="#28465b" stroke-width="4"/><path d="M35 120 Q170 40 305 120" stroke="#fff" stroke-width="28" fill="none"/><path d="M35 300 Q170 370 305 300" stroke="#526777" stroke-width="32" fill="none"/><text x="170" y="465" text-anchor="middle" class="b">Volums</text></g><g transform="translate(910 220)"><path d="M0 50 Q170 0 340 50 V390 Q170 440 0 390 Z" fill="#c7b49e" stroke="#28465b" stroke-width="4"/><path d="M0 170 Q170 120 340 170 M0 280 Q170 230 340 280" stroke="#fff" stroke-width="12" fill="none"/><text x="170" y="465" text-anchor="middle" class="b">Superfícies</text></g><text x="700" y="760" text-anchor="middle" class="s">Categories d'observació complementàries; les formes són esquemàtiques i no representen una miniatura concreta.</text></svg>