<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><defs><style>.t{font:700 30px Arial,sans-serif;fill:#183247}.h{font:700 22px Arial,sans-serif;fill:#28465b}.b{font:18px Arial,sans-serif;fill:#263b49}.s{font:16px Arial,sans-serif;fill:#526777}.p{fill:#fff;stroke:#b7c7d1;stroke-width:2}.line{stroke:#28465b;stroke-width:4;fill:none}.ray{stroke:#d3a52d;stroke-width:5;fill:none}.normal{stroke:#d34b43;stroke-width:4;stroke-dasharray:11 8;fill:none}</style></defs><rect width="1400" height="900" fill="#f3f6f8"/><text x="700" y="55" text-anchor="middle" class="t">Anàlisi de geometria, volums i superfícies</text><rect x="35" y="110" width="1330" height="680" rx="16" class="p"/><g><circle cx="700" cy="260" r="48" fill="#c8b49c" stroke="#28465b" stroke-width="3"/><path d="M650 320 L750 320 L790 500 L610 500 Z" fill="#9fb8c7" stroke="#28465b" stroke-width="3"/><path d="M650 340 L570 480 L615 500 L680 390 M750 340 L830 480 L785 500 L720 390" fill="#738c9c" stroke="#28465b" stroke-width="3"/><path d="M630 500 L625 680 H680 L700 500 M700 500 L720 680 H775 L770 500" fill="#8f9da7" stroke="#28465b" stroke-width="3"/><path d="M610 320 L790 320 M630 360 L770 360" stroke="#fff" stroke-width="5" opacity=".8"/></g><g class="b"><text x="140" y="250">Silueta general</text><path d="M330 245 H540 L655 225" class="line"/><text x="140" y="410">Volums principals</text><path d="M330 405 H540 L620 410" class="line"/><text x="140" y="570">Zones protegides</text><path d="M330 565 H545 L665 520" class="line"/><text x="1000" y="250">Plans i arestes</text><path d="M990 245 H870 L755 355" class="line"/><text x="1000" y="410">Superfícies corbes</text><path d="M990 405 H870 L745 280" class="line"/><text x="1000" y="570">Superposicions</text><path d="M990 565 H870 L800 455" class="line"/></g><text x="700" y="755" text-anchor="middle" class="s">Miniatura esquemàtica anotada: la geometria orienta l'anàlisi, però no determina automàticament la il·luminació.</text></svg>