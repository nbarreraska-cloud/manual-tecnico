0" fill="#292929" stroke="#28465b" stroke-width="3"/></g><text x="1040" y="690" text-anchor="middle" class="s">Zones clares, intermèdies i fosques</text><text x="700" y="750" text-anchor="middle" class="s">El mapa d'il·luminació descriu el plantejament lumínic; el mapa de valors, la traducció tonal escollida.</text></svg>