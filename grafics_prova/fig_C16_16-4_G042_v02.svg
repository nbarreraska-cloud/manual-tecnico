<g class="body" text-anchor="middle">
 <text x="262" y="455">Establir el valor de partida.</text>
 <text x="750" y="455">Separar plans amb masses fosques.</text>
 <text x="1237" y="455">Connectar les masses sense uniformitzar-les.</text>
 <text x="262" y="875">Definir el reflex principal sobre el pla.</text>
 <text x="750" y="875">Afegir accents màxims, petits i selectius.</text>
 <text x="1237" y="875">Ajustar amplada, transicions i continuïtat del reflex.</text>
</g>
<text x="750" y="985" text-anchor="middle" class="small">La geometria es manté constant; el patró de reflexos és un exemple gràfic simplificat, no una simulació òptica.</text>
</svg>