 <text x="262" y="455">Establir el valor de partida.</text><text x="750" y="455">Separar plans amb masses fosques.</text><text x="1237" y="455">Relacionar foscos i intermedis.</text>
 <text x="262" y="875">Definir el reflex sobre un pla concret.</text><text x="750" y="875">Afegir accents màxims selectius.</text><text x="1237" y="875">Ajustar transicions i jerarquia final.</text>
