<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
<defs>
 <style>
 .title{font:700 30px Arial,sans-serif;fill:#183247}.sub{font:700 22px Arial,sans-serif;fill:#28465b}.label{font:19px Arial,sans-serif;fill:#233746}.small{font:16px Arial,sans-serif;fill:#526777}.panel{fill:#fbfcfd;stroke:#b7c7d1;stroke-width:2}
 </style>
 <g id="scene"><rect width="230" height="145" fill="#d9edf5"/><circle cx="185" cy="30" r="17" fill="#f4ce72"/><path d="M0 105 Q60 80 115 108 T230 100 V145 H0Z" fill="#91b879"/><path d="M25 145 L80 60 L135 145Z" fill="#789c65"/><path d="M105 145 L160 78 L220 145Z" fill="#5f8658"/><rect x="145" y="62" width="10" height="60" fill="#755c42"/><circle cx="150" cy="60" r="31" fill="#477b55"/></g>
</defs>
<rect width="1400" height="850" fill="#f3f6f8"/>
<text x="700" y="52" text-anchor="middle" class="title">Tipus de vidre i diferències entre transparència i difusió</text>
<rect x="35" y="90" width="1330" height="275" rx="16" class="panel"/>
<text x="700" y="130" text-anchor="middle" class="sub">Mostres de materials</text>
<g transform="translate(130 165)">
 <rect width="230" height="150" fill="#d8edf3" fill-opacity=".16" stroke="#8ab8c4" stroke-width="7"/>
 <rect x="330" width="230" height="150" fill="#d8edf3" fill-opacity=".58" stroke="#6dabb9" stroke-width="7"/>
 <rect x="660" width="230" height="150" fill="#d8edf3" fill-opacity=".8" stroke="#83aeb7" stroke-width="7"/>
 <rect x="990" width="150" height="150" fill="#d8edf3" fill-opacity=".25" stroke="#5d8c9e" stroke-width="7"/>
 <g class="label" text-anchor="middle"><text x="115" y="185">Transparent incolor</text><text x="445" y="185">Transparent acolorit</text><text x="775" y="185">Esmerilat</text><text x="1065" y="185">Gruix / vora</text></g>
</g>
<rect x="35" y="395" width="1330" height="410" rx="16" class="panel"/>
<text x="700" y="435" text-anchor="middle" class="sub">Mateixa escena observada a través de dues superfícies</text>
<g transform="translate(180 485)">
 <use href="#scene"/>
 <rect width="230" height="145" fill="#b9e3ed" fill-opacity=".12" stroke="#6dabb9" stroke-width="8"/>
 <text x="115" y="190" text-anchor="middle" class="label">Vidre transparent</text>
</g>
<g transform="translate(650 485)">
 <use href="#scene"/>
 <rect width="230" height="145" fill="#c7dce2" fill-opacity=".42"/>
 <g opacity=".45"><rect x="0" y="0" width="230" height="145" fill="#dce7ea"/><path d="M0 35 H230 M0 75 H230 M0 115 H230" stroke="#e9f0f2" stroke-width="18"/></g>
 <rect width="230" height="145" fill="none" stroke="#83aeb7" stroke-width="8"/>
 <text x="115" y="190" text-anchor="middle" class="label">Vidre esmerilat</text>
</g>
<text x="1110" y="535" class="label">Transparent:</text><text x="1110" y="565" class="small">conserva la definició</text>
<text x="1110" y="625" class="label">Esmerilat:</text><text x="1110" y="655" class="small">difon els contorns</text>
<text x="700" y="775" text-anchor="middle" class="small">Comparació esquemàtica: mateix fons, escena i condicions; l'esmerilat difon la imatge transmesa, no la fa simplement mate.</text>
</svg>